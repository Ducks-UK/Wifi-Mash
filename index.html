<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Resource Controller</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>WiFi Resource Controller</h1>
            <button id="theme-toggle" class="theme-button">🌓</button>
        </header>

        <main>
            <div class="controls">
                <div class="card power-control">
                    <h2>Power</h2>
                    <button id="power-toggle" class="power-button">⏻</button>
                </div>

                <div class="card speed-control">
                    <h2>Speed</h2>
                    <div class="slider-container">
                        <input type="range" id="speed-slider" min="0" max="100" value="0">
                        <div class="slider-labels">
                            <span>0%</span>
                            <span>100%</span>
                        </div>
                    </div>
                </div>

                <div class="card danger-zone" id="danger-zone">
                    <h2>Danger Zone</h2>
                    <p>0-20% speed triggers warnings</p>
                </div>
            </div>

            <div class="stats">
                <div class="card">
                    <h2>Network Stats</h2>
                    <div id="stats-display">
                        <p>Upload: 0.0 Mbps</p>
                        <p>Download: 0.0 Mbps</p>
                        <p>Ping: 50 ms</p>
                    </div>
                </div>

                <div class="card speedometer">
                    <h2>Speedometer</h2>
                    <div class="speedometer-container">
                        <div class="speedometer-dial">
                            <div class="speedometer-needle"></div>
                        </div>
                        <div class="speedometer-value" id="speedometer-value">0%</div>
                    </div>
                </div>
            </div>

            <div class="footer-actions">
                <button id="useless-button" class="useless-button">Useless Button</button>
            </div>
        </main>

        <footer>
            <p>Thanks to <a href="https://www.youtube.com/@Ducks_UK" target="_blank">Ducks_UK</a> for inspiration</p>
        </footer>
    </div>

    <!-- Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span id="close-modal" class="close">&times;</span>
            <p id="modal-message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
