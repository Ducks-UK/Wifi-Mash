<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Control Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>WiFi Control</h1>

        <div class="theme-selector">
            <button class="theme-btn" data-theme="light">Light</button>
            <button class="theme-btn" data-theme="dark">Dark</button>
            <button class="theme-btn" data-theme="cat">Cat</button>
        </div>

        <div class="wifi-control">
            <div class="slider-item">
                <label for="wifi-strength">WiFi Strength</label>
                <input type="range" id="wifi-strength" min="0" max="100" value="70" class="slider">
                <span class="value">70%</span>
            </div>

            <div class="toggle-item">
                <label for="wifi-power">WiFi Power</label>
                <label class="switch">
                    <input type="checkbox" id="wifi-power" checked>
                    <span class="slider round"></span>
                </label>
            </div>
        </div>

        <div class="connection-status">
            <div class="status-indicator" id="status-indicator"></div>
            <span id="connection-text">Connected</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
