<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real WiFi Resource Consumer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Real WiFi Resource Consumer</h1>

        <div class="theme-selector">
            <button class="theme-btn" data-theme="light">Light</button>
            <button class="theme-btn" data-theme="dark">Dark</button>
            <button class="theme-btn" data-theme="cat">Cat</button>
        </div>

        <div class="wifi-control">
            <div class="slider-item">
                <label for="wifi-strength">WiFi Usage</label>
                <input type="range" id="wifi-strength" min="0" max="100" value="10" class="slider">
                <span class="value">10%</span>
            </div>

            <div class="toggle-item">
                <label for="wifi-power">WiFi Power</label>
                <label class="switch">
                    <input type="checkbox" id="wifi-power" checked>
                    <span class="slider round"></span>
                </label>
            </div>

            <div class="connection-info">
                <div class="status-indicator" id="status-indicator"></div>
                <span id="connection-text">Idle</span>
                <div id="speed-text">Data used: 0 KB</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
